# pc-control plugin configuration

server:
  name: pc-control
  version: "0.3.1"

# Security settings
security:
  # Global mode: "readonly" (only safe reads) or "active" (full control)
  mode: active

  # Dry-run: log actions but never execute them
  dry_run: false

  # Action levels that auto-execute without asking
  auto_approve:
    - safe

  # Action levels that require brief confirmation
  require_confirm:
    - sensitive

  # Action levels that require explicit confirmation with impact description
  require_explicit_confirm:
    - destructive

# Audit log
audit:
  enabled: true
  log_dir: logs
  log_file: audit.jsonl
  max_size_mb: 50
  rotate_count: 5

# File operations
files:
  # Create a .bak backup before any write/modify operation
  auto_backup: true
  backup_suffix: ".bak"

  # Paths that are always blocked (never touch these)
  blocked_paths:
    - "C:/Windows/System32"
    - "C:/Windows/SysWOW64"
    - "C:/Program Files/Windows Defender"

  # Max file size (MB) that read_file will return inline
  max_inline_read_mb: 5

# Terminal
terminal:
  # Shell to use for run_command
  default_shell: powershell

  # Commands that are always classified as destructive regardless of flags
  destructive_patterns:
    - "rm "
    - "del "
    - "rmdir"
    - "format "
    - "reg delete"
    - "reg add"
    - "net user"
    - "net localgroup"
    - "diskpart"
    - "bcdedit"
    - "sfc"
    - "takeown"
    - "icacls"
    - "attrib"
    - "cipher /w"
    - "git reset --hard"
    - "git clean"
    - "git push --force"
    - "npm uninstall"
    - "pip uninstall"
    - "wmic"
    - "taskkill /f"
    - "Stop-Process -Force"
    - "Remove-Item"
    - "Clear-Content"
    - "Clear-History"

  # Max execution time (seconds)
  timeout_seconds: 60

# Browser control (browser_* tools)
browser:
  # auto: attach to a running Edge/Chrome at cdp_url if it answers (your own
  # logged-in profile, started by Launch-PcControlBrowser.ps1), otherwise launch
  # a dedicated persistent profile. cdp: attach only. launch: dedicated profile only.
  mode: auto
  cdp_url: http://127.0.0.1:9222
  # msedge | chrome | chromium (Playwright's own), or set executable_path
  channel: msedge
  executable_path: ""
  # Empty: %LOCALAPPDATA%\VCUBF\Alfonzo\pc-control\browser-profile
  profile_dir: ""
  headless: false
  # Playwright waits for elements by itself; these are upper limits, not delays.
  default_timeout_ms: 5000
  navigation_timeout_ms: 20000
  # Most controls an AI gets per snapshot (narrow with query=...).
  max_snapshot_elements: 120
  # Skip these resource types for speed, e.g. [image, media, font]. Empty = load everything.
  block_resources: []
  # Never type into password fields: the user signs in themselves; the profile keeps the session.
  allow_password_fill: false
  # browser_eval runs arbitrary JavaScript in logged-in pages; off by default.
  allow_eval: false
  # Domains the browser and web_fetch must never open, e.g. [example.com]
  blocked_domains: []
  # Where the engine may go, checked before every request and every redirect hop:
  # public addresses only unless allow_private_network is true (loopback and
  # private networks: dev servers, router, intranet). Link-local addresses
  # (169.254.x.x, cloud metadata) are always refused.
  allow_private_network: false
  # true: https only (no http at all).
  require_https: false

# GUI control (coordinate fallback tools)
gui:
  # Screenshots are off: use ui_snapshot / browser_snapshot (text with refs).
  allow_screenshots: false

  # Screenshot quality (1-100)
  screenshot_quality: 85
  screenshot_format: png

  # Pause between pyautogui actions (seconds) – safety delay
  action_pause: 0.1

  # Failsafe: move mouse to top-left corner to abort
  failsafe: true
