name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and PostgreSQL tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # The tool-catalogue version ledger may only grow: entries that shipped
      # on master must survive unchanged. Checked against master itself,
      # because no in-repo test can see the previous ledger.
      - name: Tool catalogue ledger is append-only
        run: |
          git fetch --no-tags --depth=1 origin master
          if git show origin/master:backend/src/agents/toolCatalogue.ts > /tmp/ledger-base.ts 2>/dev/null; then
            node scripts/check-ledger-append-only.mjs /tmp/ledger-base.ts src/agents/toolCatalogue.ts
          else
            echo "No catalogue on master yet; nothing to compare."
          fi
      # The MCP toolset ledger likewise: a shipped toolset revision always
      # names the same tools and capability metadata.
      - name: MCP toolset ledger is append-only
        run: |
          git fetch --no-tags --depth=1 origin master
          if git show origin/master:backend/src/modules/mcp/routes.ts > /tmp/mcp-ledger-base.ts 2>/dev/null; then
            node scripts/check-ledger-append-only.mjs /tmp/mcp-ledger-base.ts src/modules/mcp/routes.ts MCP_TOOLSET_FINGERPRINTS
          else
            echo "No MCP gateway on master yet; nothing to compare."
          fi
      - run: npm run prisma:generate
      - run: npm run build
      - run: npm run test:embedded

  frontend:
    name: Frontend build and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # Secretary's PC Control Plus relay catalogue (pcpRelayCatalogue.generated.ts)
  # is imported from one pinned, signed PC Control Plus release
  # (windows-companion/pc-control/pcp-upstream.json). This checks out exactly
  # that commit, verifies the release manifest's Ed25519 signature with the
  # key pinned in VCUBF and every signed file hash, and fails when the committed
  # catalogue is not what that release produces. pc-control-plus is private:
  # the repository secret PCP_CATALOGUE_READ_TOKEN (a fine-grained token with
  # read-only Contents access to that one repository) is required.
  relay-catalogue:
    name: PC Control Plus relay catalogue matches the pinned signed release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read the pin
        id: pin
        run: |
          echo "repository=$(jq -r .repository windows-companion/pc-control/pcp-upstream.json)" >> "$GITHUB_OUTPUT"
          echo "commit=$(jq -r .commit windows-companion/pc-control/pcp-upstream.json)" >> "$GITHUB_OUTPUT"
      - name: The read token is configured
        env:
          TOKEN: ${{ secrets.PCP_CATALOGUE_READ_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Set the repository secret PCP_CATALOGUE_READ_TOKEN (read-only Contents on ${{ steps.pin.outputs.repository }}) so the relay catalogue can be checked."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.pin.outputs.repository }}
          ref: ${{ steps.pin.outputs.commit }}
          token: ${{ secrets.PCP_CATALOGUE_READ_TOKEN }}
          path: pcp-upstream
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Import the catalogue from the pinned release and compare
        run: |
          python -m pip install -r pcp-upstream/remote/requirements.txt cryptography
          python windows-companion/pc-control/server/import_pcp_catalogue.py --pcp pcp-upstream --pin windows-companion/pc-control/pcp-upstream.json --check

  windows-companion:
    name: Windows companion tests and script syntax
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: windows-companion
    steps:
      - uses: actions/checkout@v7
      # The owner PC runs the companion on Python 3.13.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # Pure runtime logic only: the Windows audio packages are stubbed by the
      # tests, so this is no microphone, speaker or live-provider acceptance.
      - name: Python runtime tests
        run: python -m unittest -v test_voice_gate test_voice_runtime
      # pc-control plugin: step language, UI Automation logic on a fake tree,
      # the tool registry, and the browser tools against a real headless
      # Chromium and local pages. Not an acceptance on the owner's Windows
      # desktop, Edge profile or live websites.
      - name: pc-control plugin tests
        working-directory: windows-companion/pc-control/tests
        env:
          PC_CONTROL_REQUIRE_BROWSER: "1"
        run: |
          python -m pip install "fastmcp>=2.12" "playwright>=1.50" "PyYAML>=6.0" "psutil>=5.9"
          python -m playwright install --with-deps chromium
          python -m unittest -v test_steps test_desktop_ui test_registry test_status test_engine test_browser test_security test_text_state_only
      # A syntax error in an installer or launcher would only show on the PC.
      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem -Path . -Filter *.ps1 -Recurse) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            foreach ($problem in $errors) {
              Write-Host "::error file=$($file.FullName),line=$($problem.Extent.StartLineNumber)::$($problem.Message)"
              $failed = $true
            }
            if (-not $errors) { Write-Host "ok $($file.Name)" }
          }
          if ($failed) { exit 1 }
